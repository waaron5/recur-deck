<!doctype html>
<!-- PROTOTYPE (ticket 06), throwaway. Three variants of slides 1-3, rendered by macOS Quick Look from the one-slide PPTX files.
     Switch with the bottom bar, the arrow keys, or ?variant=A|B|C. Real-PowerPoint versions: out/prototype-{A,B,C}.pptx -->
<meta charset="utf-8">
<title>Sell deck prototype · slides 1-3</title>
<style>
  body { margin: 0; background: #d9dde3; font: 14px -apple-system, system-ui, sans-serif; color: #09142f; }
  main { max-width: 1320px; margin: 0 auto; padding: 24px 16px 96px; }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 16px; }
  figure { margin: 0 0 24px; }
  figcaption { font-size: 12px; color: #4b5563; margin-bottom: 6px; }
  img { width: 100%; display: block; box-shadow: 0 2px 10px rgba(0,0,0,.18); background: #fff; }
  .bar { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; gap: 12px; align-items: center;
         background: #111; color: #fff; padding: 8px 14px; border-radius: 999px; box-shadow: 0 4px 16px rgba(0,0,0,.35); }
  .bar button { background: #333; color: #fff; border: 0; border-radius: 999px; width: 32px; height: 32px; font-size: 16px; cursor: pointer; }
  .bar span { min-width: 260px; text-align: center; font-weight: 600; }
</style>
<main>
  <h1>PROTOTYPE · not the submission deck · illustrative copy</h1>
  <figure><figcaption>Slide 1 · Cover</figcaption><img id="s1" alt="Cover"></figure>
  <figure><figcaption>Slide 2 · Thesis</figcaption><img id="s2" alt="Thesis"></figure>
  <figure><figcaption>Slide 3 · Market map</figcaption><img id="s3" alt="Market map"></figure>
</main>
<div class="bar"><button id="prev" aria-label="Previous variant">←</button><span id="label"></span><button id="next" aria-label="Next variant">→</button></div>
<script>
  const variants = { A: 'Reference look', B: 'Plate / columns / cross + navy sidebar', C: 'Split / label rail / packed cells' };
  const keys = Object.keys(variants);
  function show(v) {
    for (const n of [1, 2, 3]) document.getElementById('s' + n).src = `ql/${v}-slide${n}.pptx.png`;
    document.getElementById('label').textContent = `${v} (${variants[v]})`;
    const u = new URL(location.href); u.searchParams.set('variant', v); history.replaceState(null, '', u);
  }
  let cur = new URLSearchParams(location.search).get('variant');
  if (!keys.includes(cur)) cur = 'A';
  const step = (d) => { cur = keys[(keys.indexOf(cur) + d + keys.length) % keys.length]; show(cur); };
  document.getElementById('prev').onclick = () => step(-1);
  document.getElementById('next').onclick = () => step(1);
  addEventListener('keydown', (e) => {
    if (e.target.closest && e.target.closest('input, textarea, [contenteditable]')) return;
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });
  show(cur);
</script>
